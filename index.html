<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#05070b">
<meta name="description" content="CONGELAZO: el juego de los congelados en versión pesadilla. Avanza cuando no te miran. Quédate quieto cuando se voltea.">
<title>CONGELAZO</title>
<meta property="og:title" content="CONGELAZO">
<meta property="og:description" content="Congelados de terror en 3D. No te muevas. No parpadees.">
<meta property="og:image" content="https://gamexic.github.io/congelazo/og.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Concepto: pantalla completa de juego, UI de hielo y sodio sobre negro azulado. Un solo look oscuro a propósito. */
:root{
  --bg:#050709; --ink:#eaf0f2; --mute:#8f9ca5; --ice:#b9dcec; --ice2:#7fb0c8; --warn:#ff4a3d; --sodio:#ffb347; --acc:#ffb347;
  --panel:rgba(8,12,16,.72); --line:rgba(190,215,230,.16);
  --display:'Anton','Impact','Arial Narrow Bold',sans-serif; --ui:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --ease:cubic-bezier(.23,1,.32,1); color-scheme:dark;
  --sl:max(16px,env(safe-area-inset-left,0px)); --sr:max(16px,env(safe-area-inset-right,0px));
  --st:max(10px,env(safe-area-inset-top,0px)); --sb:max(12px,env(safe-area-inset-bottom,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;height:100%;height:100dvh;overflow:hidden;background:var(--bg)}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
[hidden]{display:none!important}

/* capas de atmósfera */
.fx{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at 50% 45%,transparent 38%,rgba(0,0,0,.78) 100%);opacity:.9}
#red{background:radial-gradient(ellipse at 50% 50%,rgba(255,40,30,0) 30%,rgba(255,30,20,.55) 100%);opacity:0;transition:opacity .12s linear}
#grain{opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");animation:grain .9s steps(6) infinite}
@keyframes grain{0%{transform:translate3d(0,0,0)}20%{transform:translate3d(-12px,8px,0)}40%{transform:translate3d(10px,-14px,0)}60%{transform:translate3d(-6px,-6px,0)}80%{transform:translate3d(14px,10px,0)}100%{transform:translate3d(0,0,0)}}
#flash{background:#fff;opacity:0}
#flash.red{background:#ff2a1a}

/* HUD */
#hud{position:absolute;inset:0;z-index:3;pointer-events:none}
#hud>*{pointer-events:none}
#hud button,#hud .ptr{pointer-events:auto}
.top{position:absolute;top:var(--st);left:var(--sl);right:var(--sr);display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.top .chip.role{font-size:13px;padding:5px 10px;min-height:44px;max-width:44vw;line-height:1.05}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chip b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:0;font-variant-numeric:tabular-nums}
.icon-btn{width:44px;height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;transition:transform .16s var(--ease)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:22px;height:22px;stroke:var(--ice);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top .grp{display:flex;gap:8px;align-items:center}
#state{position:absolute;left:50%;top:calc(var(--st) + 100px);transform:translateX(-50%);font-family:var(--display);font-size:clamp(26px,7vw,46px);letter-spacing:.08em;text-shadow:0 0 18px currentColor;transition:color .12s linear;white-space:nowrap}
#state.go{color:var(--ice)} #state.stop{color:var(--warn)} #state.cue{color:var(--sodio)}
#eye{position:absolute;left:50%;top:calc(var(--st) + 54px);transform:translateX(-50%);width:64px;height:40px}
#eye svg{width:100%;height:100%}
#eye .iris,#eye .pup,#eye .shut{transition:opacity .15s}
#eye .iris{fill:var(--warn)}
#eye:not(.open) .iris,#eye:not(.open) .pup{opacity:0}
#eye .shut{opacity:1}#eye.open .shut{opacity:0}
#lane{position:absolute;right:var(--sr);top:calc(var(--st) + 150px);bottom:calc(var(--sb) + 190px);width:14px;border-radius:7px;background:rgba(10,16,24,.7);border:1px solid var(--line)}
#lane i{position:absolute;left:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--mute);transition:opacity .2s}
#lane i.me{width:13px;height:13px;margin:-6.5px 0 0 -6.5px;background:var(--ice);box-shadow:0 0 10px var(--ice)}
#lane i.dead{opacity:0}
#lane::after{content:"";position:absolute;top:-8px;left:-3px;right:-3px;height:5px;border-radius:3px;background:var(--warn)}
#eyes{position:absolute;left:var(--sl);bottom:calc(var(--sb) + 8px);width:min(46vw,240px)}
#eyes small{display:block;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--mute);margin-bottom:4px}
#eyes .bar{height:10px;border-radius:5px;background:rgba(10,16,24,.8);border:1px solid var(--line);overflow:hidden}
#eyes .bar>div{height:100%;width:100%;background:var(--ice);transform-origin:left;will-change:transform}
#lookBtn{position:absolute;right:var(--sr);bottom:calc(var(--sb) + 8px);width:clamp(104px,28vw,140px);height:clamp(104px,28vw,140px);border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(255,74,61,.5),rgba(40,6,6,.85));border:2px solid rgba(255,74,61,.7);font-family:var(--display);font-size:20px;letter-spacing:.04em;color:#ffd9d4;transition:transform .16s var(--ease);box-shadow:0 0 30px rgba(255,74,61,.25)}
#lookBtn:active{transform:scale(.95)}
#lookBtn.on{background:radial-gradient(circle at 50% 40%,#ff4a3d,#5a0e0a);box-shadow:0 0 44px rgba(255,74,61,.6)}
#lookBtn.dis{opacity:.4}
#stick{position:absolute;left:var(--sl);bottom:calc(var(--sb) + 8px);width:clamp(130px,34vw,168px);height:clamp(130px,34vw,168px);border-radius:50%;background:radial-gradient(circle,rgba(169,227,255,.08),rgba(169,227,255,.02) 70%);border:2px solid var(--line);touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#d8f3ff,#4aa3d4);box-shadow:0 0 18px rgba(95,182,232,.5);will-change:transform}
#stick span{position:absolute;left:0;right:0;top:-24px;text-align:center;font-weight:700;letter-spacing:.12em;font-size:13px;color:var(--mute);text-transform:uppercase}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,0);font-family:var(--display);font-size:clamp(30px,9vw,60px);letter-spacing:.06em;text-align:center;color:var(--ice);text-shadow:0 0 24px currentColor;opacity:0;transition:opacity .2s var(--ease),transform .2s var(--ease);padding:0 16px;max-width:100%}
#toast.show{opacity:1;transform:translate(-50%,-8px)}
#toast.bad{color:var(--warn)}

/* menú */
#menu{position:absolute;inset:0;z-index:3;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:
  linear-gradient(180deg,rgba(3,5,8,.5) 0%,rgba(3,5,8,.28) 20%,rgba(3,5,8,.74) 56%,rgba(3,5,8,.93) 100%);
  padding:var(--st) var(--sr) 0 var(--sl);touch-action:pan-y}
.wrap{max-width:760px;margin:0 auto;padding-bottom:calc(var(--sb) + 96px)}
#menu,.sheet{scrollbar-width:auto;scrollbar-color:var(--acc) rgba(255,255,255,.1)}
#menu::-webkit-scrollbar,.sheet::-webkit-scrollbar{width:14px}
#menu::-webkit-scrollbar-track,.sheet::-webkit-scrollbar-track{background:rgba(255,255,255,.07)}
#menu::-webkit-scrollbar-thumb,.sheet::-webkit-scrollbar-thumb{background:var(--acc);border-radius:8px;border:3px solid rgba(5,7,9,.9);min-height:48px}
#more{position:fixed;z-index:5;right:max(26px,calc(var(--sr) + 12px));bottom:calc(var(--sb) + 84px);width:48px;height:48px;border-radius:50%;background:var(--panel);border:1.5px solid var(--acc);box-shadow:0 0 22px color-mix(in srgb,var(--acc) 35%,transparent);display:grid;place-items:center;transition:opacity .2s,transform .16s var(--ease)}
#more:active{transform:scale(.94)}
#more svg{width:24px;height:24px;stroke:var(--acc);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
#more.up svg{transform:rotate(180deg)}
#menu::after{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 40%,rgba(0,0,0,.6) 100%)}
.ph{display:block;position:relative;border-radius:9px;overflow:hidden;background:#0a1016;line-height:0}
.ph::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 26px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.06)}
.ph img,.ph svg.pic{width:100%;height:auto;display:block;border-radius:0;aspect-ratio:var(--ar,auto);object-fit:cover}
.card.sc .ph{--ar:3/2}
#chars .ph{--ar:4/5}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(46px,13.2vw,128px);line-height:.92;white-space:nowrap;margin:clamp(12px,3vh,32px) 0 8px;letter-spacing:.015em;text-transform:uppercase;color:transparent;background:linear-gradient(180deg,#f6fbfd 8%,#a9c9d8 55%,#55768a 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 24px rgba(120,190,230,.28)) drop-shadow(0 5px 0 rgba(0,0,0,.65));animation:flick 6s infinite;text-wrap:balance}
.logo em{font-style:normal;color:transparent;background:linear-gradient(180deg,#ff8a7a 8%,#e0261a 55%,#7a0e08 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 20px rgba(255,60,40,.45))}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.55}94%{opacity:1}96%{opacity:.4}97%{opacity:1}}
.tag{margin:0 0 4px;font-size:clamp(17px,4.4vw,22px);font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--mute)}
h2{font-family:var(--ui);font-weight:700;font-size:15px;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin:clamp(16px,3vh,26px) 0 10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:grid;gap:10px}
.r2{grid-template-columns:repeat(2,minmax(0,1fr))} .r3{grid-template-columns:repeat(3,minmax(0,1fr))} .r4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.r4{grid-template-columns:repeat(2,minmax(0,1fr))} .r3.sc{grid-template-columns:minmax(0,1fr)}}
.card{position:relative;text-align:left;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .16s var(--ease),border-color .16s,box-shadow .16s}
.card:active{transform:scale(.97)}
.card[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 30px color-mix(in srgb,var(--acc) 28%,transparent);background:rgba(14,20,26,.82)}
.card.dis{opacity:.45;pointer-events:none}
.card svg.pic{width:100%;height:auto;display:block}
.card h3{margin:0;overflow-wrap:anywhere;font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.05em;text-transform:uppercase}
.card p{margin:0;font-size:15.5px;line-height:1.2;color:var(--mute);font-weight:500}
.card.sc{flex-direction:row;align-items:stretch}
.card.sc .ph{width:40%;flex:none;align-self:flex-start}
.card.sc .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.card.sc .who{color:var(--sodio);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
@media (min-width:561px){.card.sc{flex-direction:column}.card.sc .ph{width:100%}}
.meter{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.meter span{width:62px}.meter b{flex:1;height:5px;border-radius:3px;background:#17222e;overflow:hidden;display:block}.meter b i{display:block;height:100%;background:var(--acc)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .card{flex:1;min-width:92px;align-items:center;text-align:center;padding:12px 8px}
.seg .card h3{font-size:17px}
.big{padding:12px;flex-direction:column;align-items:flex-start;gap:6px}
@media (min-width:600px){.big{flex-direction:row;align-items:center;gap:12px}}
.big .rp{width:72px;height:72px;flex:none;display:grid;place-items:center}.big .rp img{width:100%;height:100%;aspect-ratio:1;object-position:50% 25%}.big svg{width:46%;height:46%;stroke:var(--ice);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.big div{min-width:0}.big h3{font-size:clamp(18px,5.4vw,22px)}
#dock{position:fixed;left:0;right:0;bottom:0;padding:12px var(--sr) var(--sb) var(--sl);background:linear-gradient(0deg,var(--bg) 55%,rgba(5,7,11,0));display:flex;justify-content:center}
#play{width:min(100%,520px);height:58px;border-radius:12px;background:linear-gradient(180deg,#f0f7fa,#8fb0c0);color:#06141c;font-family:var(--display);font-size:28px;letter-spacing:.14em;box-shadow:0 8px 34px color-mix(in srgb,var(--acc) 30%,transparent),inset 0 -4px 0 rgba(0,0,0,.2);transition:transform .16s var(--ease)}
#play:active{transform:scale(.97)}
.fine{margin:18px 0 0;color:var(--mute);font-size:15px;line-height:1.3}

/* pantallas intermedias */
.sheet{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:rgba(3,5,8,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);padding:var(--st) var(--sr) var(--sb) var(--sl);overflow:auto}
.box{width:min(100%,460px);background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:20px 18px;text-align:center}
.box h2{display:block;border:0;margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:clamp(32px,9vw,48px);letter-spacing:.06em;text-transform:uppercase;color:var(--ice)}
.box h2::after{display:none}
.box.bad h2{color:var(--warn);text-shadow:0 0 22px rgba(255,74,61,.5)}
.box p{margin:6px 0;font-size:19px;line-height:1.25;color:var(--ink);font-weight:500}
.box p.sm{color:var(--mute);font-size:16px}
.stats{display:flex;gap:8px;justify-content:center;margin:12px 0}
.stats .chip b{text-transform:none}
.stats .chip{flex-direction:column;gap:0;align-items:center;min-width:78px;padding:8px 10px}
.btns{display:grid;gap:10px;margin-top:14px}
.btn{height:52px;border-radius:12px;font-family:var(--display);font-size:22px;letter-spacing:.1em;background:linear-gradient(180deg,#f0f7fa,#8fb0c0);color:#04121c;transition:transform .16s var(--ease)}
.btn:active{transform:scale(.97)} .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ice)}
.tip{display:grid;gap:8px;text-align:left;margin:12px 0 4px}
.tip div{display:flex;gap:10px;align-items:flex-start;font-size:18px;line-height:1.2;font-weight:500}
.tip i{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(95,182,232,.18);border:1px solid var(--ice2);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:13px;color:var(--ice)}
@media (prefers-reduced-motion:reduce){#grain,.logo{animation:none}}
@media (max-height:430px) and (orientation:landscape){#state{top:calc(var(--st) + 62px);font-size:22px}#eye{top:calc(var(--st) + 18px);transform:translateX(-50%) scale(.8);transform-origin:top}#toast{top:30%}#lane{bottom:calc(var(--sb) + 8px)}.logo{font-size:44px;margin-top:4px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl" aria-label="Escena del juego"></canvas>
  <div id="vig" class="fx"></div><div id="red" class="fx"></div><div id="grain" class="fx"></div><div id="flash" class="fx"></div>

  <div id="hud" hidden>
    <div class="top">
      <div class="chip role" id="chipRole">...</div>
      <div class="grp"><div class="chip"><b id="timeV">0</b></div><button class="icon-btn" id="btnSnd" aria-label="Sonido"></button><button class="icon-btn" id="btnPause" aria-label="Pausa"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button></div>
    </div>
    <div id="eye" aria-hidden="true"><svg viewBox="0 0 64 40"><path d="M3 20C14 6 50 6 61 20 50 34 14 34 3 20Z" fill="#0f1822" stroke="#a9e3ff" stroke-width="2"/><circle class="iris" cx="32" cy="20" r="9"/><circle class="pup" cx="32" cy="20" r="4" fill="#05070b"/><path class="shut" d="M3 20Q32 30 61 20" fill="none" stroke="#a9e3ff" stroke-width="3" stroke-linecap="round"/></svg></div>
    <div id="state" class="go">AVANZA</div>
    <div id="lane" aria-hidden="true"></div>
    <div id="stick" class="ptr" data-part><span>Mueve</span><i></i></div>
    <div id="eyes" data-watch hidden><small>Tus ojos</small><div class="bar"><div></div></div></div>
    <button id="lookBtn" data-watch hidden>MIRAR</button>
    <div id="toast"></div>
  </div>

  <main id="menu">
    <div class="wrap">
      <h1 class="logo">CONGE<em>LAZO</em></h1>
      <p class="tag">No te muevas. No parpadees.</p>

      <h2>Tu rol</h2>
      <div class="row r2" id="roles">
        <button class="card big" data-role="part" aria-pressed="true"><span class="ph rp" data-k="rp"><svg viewBox="0 0 48 48"><circle cx="24" cy="12" r="7"/><path d="M24 20v14M24 26l-9 8M24 26l9 6M24 34l-7 11M24 34l7 11"/></svg></span><div><h3>Participante</h3><p>Avanza. Quédate quieto cuando se voltee.</p></div></button>
        <button class="card big" data-role="watch" aria-pressed="false"><span class="ph rp" data-k="rw"><svg viewBox="0 0 48 48"><path d="M3 24C12 10 36 10 45 24 36 38 12 38 3 24Z"/><circle cx="24" cy="24" r="7"/></svg></span><div><h3>Vigilante</h3><p>Voltea. Señala a quien se mueva.</p></div></button>
      </div>

      <div id="secChar"><h2>Tu personaje</h2><div class="row r4" id="chars"></div></div>

      <h2>Escenario</h2>
      <div class="row r3 sc" id="scens"></div>

      <h2>Dificultad</h2>
      <div class="seg" id="diffs">
        <button class="card" data-d="0" aria-pressed="false"><h3>Inquieto</h3><p>Más tiempo para frenar</p></button>
        <button class="card" data-d="1" aria-pressed="true"><h3>Helado</h3><p>El reto justo</p></button>
        <button class="card" data-d="2" aria-pressed="false"><h3>Pesadilla</h3><p>Sin piedad</p></button>
      </div>
      <p class="fine">Sonido recomendado. En iPhone funciona aunque el interruptor esté en silencio. Para jugar con una sola mano, usa el pulgar en el control.</p>
    </div>
    <button id="more" aria-label="Desplazar el menú"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></button>
    <div id="dock"><button id="play">JUGAR</button></div>
  </main>

  <div id="ready" class="sheet" hidden>
    <div class="box"><h2 id="rTitle"></h2><div class="tip" id="rTips"></div><div class="btns"><button class="btn" id="rGo">EMPEZAR</button><button class="btn ghost" id="rBack">Cambiar elección</button></div></div>
  </div>
  <div id="pause" class="sheet" hidden>
    <div class="box"><h2>Pausa</h2><p class="sm">Respira. Nadie se mueve.</p><div class="btns"><button class="btn" id="pResume">SEGUIR</button><button class="btn ghost" id="pMenu">Salir al menú</button></div></div>
  </div>
  <div id="end" class="sheet" hidden>
    <div class="box" id="endBox"><h2 id="eTitle"></h2><p id="eMsg"></p><div class="stats" id="eStats"></div><div class="btns"><button class="btn" id="eAgain">OTRA VEZ</button><button class="btn ghost" id="eMenu">Menú</button></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

        silentEl=document.createElement('audio');silentEl.src='data:audio/wav;base64,'+btoa(bin);silentEl.loop=true;silentEl.setAttribute('playsinline','');silentEl.volume=.01;silentEl.style.display='none';document.body.appendChild(silentEl);
      }

    }catch(e){}

    MG=AC.createGain();MG.gain.value=S.sound?.9:0;
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=8;comp.attack.value=.004;comp.release.value=.25;const post=AC.createGain();post.gain.value=1.25;MG.connect(comp);comp.connect(post);post.connect(AC.destination);

function pickScreen(cx,cy){

    animGiant(W.mesh.userData,dt,G.elapsed||0,{lkB:W.lkB,lkH:W.lkH,tap:W.tap,point:W.point?W.pointV:null,pointK:W.pointK,expr:W.expr});

function stepUpdate(dt){
  G.elapsed+=dt;const df=DIFF[S.diff],part=S.role==='part';
  const lookRate=1/.30;
  if(part){
    W.t+=dt;
    if(W.phase==='chant'){
      while(W.note<W.notes&&W.t>=W.note*W.period){if(W.note<W.notes-1){sMusic(W.note);W.tap=1;}else{sDong();for(const b of bots){if(!b.alive)continue;b.miss=Math.random()<df.miss;b.stopAt=G.elapsed+rnd(df.react[0],df.react[1]);}}W.note++;}
      if(W.note>=W.notes){W.phase='cue';W.t=0;}
    }else if(W.phase==='cue'){
      if(W.t>=W.cueD){W.phase='turn';W.t=0;W.lookT=1;W.sinceTurn=0;sCreak();}
    }else if(W.phase==='turn'||W.phase==='stare'){
      W.sinceTurn+=dt;if(W.phase==='turn'&&W.look>.95){W.phase='stare';W.t=0;}
      if(W.phase==='stare'&&W.t>=W.stareD){W.phase='back';W.lookT=0;W.t=0;sCreak();}
    }else if(W.phase==='back'){if(W.look<.04){startChant();}}
  }else{
    W.lookT=eyeOn?1:0;if(eyeOn&&W.look<.5)W.sinceTurn=0;W.sinceTurn+=dt;
    if(eyeOn){eyeStam=Math.max(0,eyeStam-df.eyeDrain*dt);if(eyeStam<=0){eyeOn=false;blinkLock=1.2;$('#lookBtn').classList.remove('on');$('#lookBtn').textContent='MIRAR';showToast('¡Parpadeaste!',true,900);flash(false,.5,.2);}}
    else{eyeStam=Math.min(1,eyeStam+.34*dt);}
    if(blinkLock>0)blinkLock-=dt;
  }
  const d=W.lookT-W.look;W.look+=clamp(d,-lookRate*dt,lookRate*dt);
  updateWatcherVisual(dt,part);
  const watched=W.look>.6&&W.sinceTurn>.1+(part?P.cfg.calm:0);
  const facing=W.look>.45;
  let tension=0;
  if(part&&P.alive){
    let ix=joy.x,iy=joy.y;
    if(keys.KeyW||keys.ArrowUp)iy=-1;if(keys.KeyS||keys.ArrowDown)iy=1;if(keys.KeyA||keys.ArrowLeft)ix=-1;if(keys.KeyD||keys.ArrowRight)ix=1;
    const mag=Math.min(1,Math.hypot(ix,iy));const dead=.18;const m=mag<dead?0:(mag-dead)/(1-dead);
    const want=m*6.0*P.cfg.speed;P.speed+=(want-P.speed)*Math.min(1,dt*(want>P.speed?9:30));if(m===0&&P.speed<.3)P.speed=0;
    if(P.speed>0){const nx=mag?ix/mag:0,nz=mag?iy/mag:0;P.z+=nz*P.speed*dt;P.x+=nx*P.speed*dt*.75;P.z=clamp(P.z,WIN_Z-.5,START_Z+4);P.x=clamp(P.x,-LANE_W+.6,LANE_W-.6);
      P.stepT-=dt;if(P.stepT<=0){P.stepT=.42*(5/Math.max(2,P.speed));sStep(SC[S.scen].id);}}
    const moving=P.speed>.45;
    if(moving&&watched){P.alive=false;beginScare(null);return;}
    if(P.z<=WIN_Z){return endGame(true);}
    tension=clamp(1-(P.z-WIN_Z)/50,0,1)*.6+(facing?.4:0);
    P.mesh.position.set(P.x,0,P.z);
    const fear=facing&&P.speed<.3?1:0;setExpr(P.mesh,fear?'f':'n');
    animHuman(P.mesh,dt,G.elapsed,P.speed,fear);
  }
  let alive=0;
  for(const b of bots){
    if(b.dying){b.dying+=dt;if(animDeath(b.mesh,b.dying,b.dctx)){world.remove(b.mesh);b.dying=0;b.gone=true;}continue;}
    if(!b.alive||b.gone)continue;alive++;
    let go=false;
    if(part){
      if(W.phase==='chant')go=G.elapsed>=b.resumeAt;
      else if(W.phase==='cue')go=b.miss||G.elapsed<b.stopAt;
      else go=b.miss;
    }else{
      if(W.look>.2){if(b.spot===null){b.spot=G.elapsed+rnd(df.watchBotReact[0],df.watchBotReact[1]);b.reck=Math.random()<df.reck?rnd(.5,.9):0;}
        go=(G.elapsed<b.spot)||(b.reck>0&&(b.reck-=dt)>0);b.resumeAt=G.elapsed+rnd(.25,.7);}
      else{b.spot=null;b.reck=0;go=G.elapsed>=b.resumeAt;}
    }
    const want=go?b.speed*(b.z<16?1.15:1):0;b.v+=(want-b.v)*Math.min(1,dt*(want>b.v?6:20));if(!go&&b.v<.25)b.v=0;
    b.moving=b.v>.4;b.z-=b.v*dt;
    b.x+=Math.sin(G.elapsed*.7+b.mesh.userData.ph)*.2*dt*(b.v>.4?1:0);
    if(b.z<24)b.x*=1-dt*.25;
    for(const o of bots){if(o===b||!o.alive)continue;const dz=o.z-b.z,dx=o.x-b.x;if(Math.abs(dz)<1&&Math.abs(dx)<.8){b.x-=Math.sign(dx||.1)*dt*1.8;}}
    b.x=clamp(b.x,-LANE_W+.6,LANE_W-.6);
    b.mesh.position.set(b.x,0,b.z);
    const lookF=part?W.look>.45:W.look>.2;const fear=lookF&&!b.moving?1:(lookF?.5:0);b.fear=fear;
    setExpr(b.mesh,lookF?(b.moving&&!part?'s':'f'):'n');
    animHuman(b.mesh,dt,G.elapsed,b.v,fear);
    b.stepT-=dt;if(b.moving&&b.stepT<=0){b.stepT=.5;if(Math.abs(b.z-(part?P.z:3))<26&&Math.random()<.5)sStep(SC[S.scen].id);}
    const hm=b.mesh.userData;
    const flag=!part&&facing&&b.moving;hm.haloMat.color.setHex(flag?0xff2a1a:b.c.col);hm.halo.scale.setScalar((flag?1.8+Math.sin(G.elapsed*30)*.3:1)*(b.big?2:1));hm.haloGlow.material.color.setHex(flag?0xff2a1a:b.c.col);
    if(part&&b.moving&&watched){killBot(b);G.killed++;alive--;if(P.alive)showToast('Alguien se movió',false,700);continue;}
    if(b.z<=WIN_Z){if(part){P.alive=false;return endGame(false,'Alguien llegó antes que tú.');}else{b.alive=false;beginScare(b);return;}}
  }
  if(!part&&alive===0&&!bots.some(b=>b.dying))return endGame(true);
  if(G.elapsed>=G.limit)return endGame(false,'Se acabó el tiempo.');
  for(let i=G.beams.length-1;i>=0;i--){const bm=G.beams[i];bm.t+=dt;if(bm.t>.5)G.beams.splice(i,1);}
  hudUpdate(part,watched,facing,tension,alive);
}

let bobT=0;
function updateCamera(dt){
  const part=S.role==='part';const asp=innerWidth/innerHeight;
  const lk0=ease(clamp(W.look,0,1));const tf=part?(asp<.8?82:asp<1.2?72:62)-(W.look>.5?4:0):lerp(asp<.8?86:70,asp<.8?58:50,lk0);if(Math.abs(camera.fov-tf)>.1){camera.fov+=(tf-camera.fov)*Math.min(1,dt*6);camera.updateProjectionMatrix();}
  if(part){
    const back=asp<.8?8.5:6.4,up=asp<.8?4.2:3.1;bobT+=dt*P.speed*1.1;
    tmpV.set(P.x*.8,up+Math.sin(bobT*2)*.05*Math.min(1,P.speed/4),P.z+back);camera.position.lerp(tmpV,Math.min(1,dt*10));

    camera.rotation.x=.32*(1-lk)-.05*lk+Math.sin(G.elapsed*.7)*.006;camera.rotation.z=Math.sin(G.elapsed*.6)*.004;
  }
  if(G.shake>0){G.shake=Math.max(0,G.shake-dt*1.2);if(!reduceMotion){camera.position.x+=rnd(-1,1)*G.shake*.25;camera.position.y+=rnd(-1,1)*G.shake*.25;}}
}
function updateBeams(){

function beginScare(lunger){
  G.state='scare';G.scare={t:0,lunger,cam:camera.position.clone(),fov:camera.fov};G.shake=.3;
  humStop();stopAmb();if(lunger)sKill();else sRiser();

  flash(true,.35,.4);$('#hud').style.opacity='0';
}
function updateScare(dt){
  const sc=G.scare;sc.t+=dt;
  if(!sc.lunger){
    animDeath(P.mesh,Math.max(0,sc.t-.12),P.dctx);
    updateWatcherVisual(dt,true);W.point=true;W.pointK=Math.min(1,sc.t*5);W.pointV.set(P.x,1.3,P.z);
    if(sc.t<1.15&&sc.t>.12){G.beams=[{b:{x:P.x,z:P.z},t:0}];}
    else if(sc.t>=1.15){G.beams=[];}
    const k=clamp(sc.t/1.15,0,1);
    tmpV.set(P.x*.8,lerp(sc.cam.y,2.2,k),lerp(sc.cam.z,P.z+3.8,ease(k)));camera.position.lerp(tmpV,Math.min(1,dt*8));
    camera.lookAt(P.x,lerp(1.8,1,k),P.z-lerp(10,0,k));
    camera.fov=lerp(sc.fov,50,k);camera.updateProjectionMatrix();
    if(sc.t>1.15&&!sc.l){sc.l=true;sScare();flash(false,.9,.6);G.shake=.7;W.mesh.rotation.y=0;}
    if(sc.l){
      const u=clamp((sc.t-1.15)/.5,0,1),e=u*u*u;const tz=camera.position.z-2.2;
      W.mesh.position.set(lerp(0,camera.position.x,e),0,lerp(0,tz,e));W.mesh.scale.setScalar(1.35+e*.35);
      const hd=W.mesh.userData.head;hd.updateWorldMatrix(true,false);hd.getWorldPosition(tmpV);camera.position.y=lerp(camera.position.y,tmpV.y+.4,u);tmpV.y+=.7;camera.lookAt(tmpV);
      G.shake=.6;
      if(!reduceMotion){camera.position.x+=rnd(-.15,.15);camera.position.y+=rnd(-.12,.12);}
    }
    if(sc.t>2.15&&!sc.end){sc.end=true;$('#hud').style.opacity='1';endGame(false,'Te moviste. Él lo vio.',true);}
  }else{
    const b=sc.lunger,u=clamp(sc.t/.5,0,1),e=u*u*u;
    const tz=camera.position.z+1.2;b.mesh.position.set(lerp(b.x,camera.position.x,e),0,lerp(b.z,tz,e));b.mesh.scale.setScalar(1+e*.9);
    camera.rotation.set(0,Math.PI,0,'YXZ');camera.rotation.x=-.1*e;
    if(!reduceMotion){camera.position.x+=rnd(-.08,.08);camera.position.y+=rnd(-.08,.08);}
    if(sc.t>.2&&!sc.l){sc.l=true;sScare();}
    if(sc.t>.52&&!sc.f1){sc.f1=true;flash(false,1,.7);}
    if(sc.t>1.3&&!sc.end){sc.end=true;$('#hud').style.opacity='1';endGame(false,'Te tocaron.',true);}
  }
  if(sc.t>1.2&&!sc.fb&&!sc.lunger){sc.fb=true;}
}

/* ciclo */
let last=0,raf=0,fpsAcc=0,fpsN=0,hbT=0;
function frame(now){
  raf=requestAnimationFrame(frame);
  const t=now/1000;let dt=Math.min(.05,t-last);last=t;if(dt<=0)return;
  if(G.state==='play'){stepUpdate(dt);if(G.state==='play'){updateCamera(dt);updateBeams();tickAmb();heart(dt);}}
  else if(G.state==='scare'){updateScare(dt);updateBeams();}
  else if(G.state==='menu'||G.state==='ready'||G.state==='pause'||G.state==='end'){
    if(G.state==='menu')tickAmb();
    if(world&&G.state!=='pause'){const idle=!G.elapsed||G.state!=='end';camera.position.set(Math.sin(t*.12)*3,3.4,26);camera.lookAt(0,3,0);W.mesh.rotation.y=Math.PI;if(S.role==='part')updateWatcherVisual(dt,true);}
  }
  if(G.state==='play'||G.state==='scare'||G.state==='menu'||G.state==='ready'||G.state==='end'){
    if(world){anim.forEach(f=>f(t,dt));for(const p of plights){const fl=.82+.18*Math.sin(t*p.sp+p.ph)*Math.sin(t*3.1+p.ph);p.l.intensity=p.base*(Math.random()<.02&&SC[S.scen].id!=='maizal'?.25:fl);}updateSun();}
    updateAsh(dt);
  }
  renderer.render(scene,camera);
  fpsAcc+=dt;fpsN++;if(fpsAcc>2){const fps=fpsN/fpsAcc;fpsAcc=0;fpsN=0;if(fps<38&&PR>1.1){PR=Math.max(1,PR-.35);renderer.setPixelRatio(PR);resize();}else if(fps<28&&sun&&sun.castShadow){sun.castShadow=false;renderer.shadowMap.enabled=false;scene.traverse(o=>{if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true);}});}}
}
function heart(dt){const close=P.alive&&S.role==='part'?clamp(1-(P.z-WIN_Z)/60,0,1):0;const tn=S.role==='part'?close*.5+(W.look>.5?.5:0):(W.look>.5?.4:.15);hbT-=dt;if(hbT<=0){sThump(.4+tn*.6);hbT=lerp(1.1,.38,tn);}}

  const box=$('#endBox');box.classList.toggle('bad',!win);
  $('#eTitle').textContent=win?(part?'¡LLEGASTE!':'NADIE PASÓ'):(part?'CONGELADO':'TE ALCANZARON');
  $('#eMsg').textContent=win?(part?'Tocaste su espalda. Él no se dio cuenta. Esta vez.':'Los miraste a todos. Ninguno llegó hasta ti.'):(msg||'');
  const surv=bots.filter(b=>b.alive).length;
  $('#eStats').innerHTML='<div class="chip"><span>Tiempo</span><b>'+Math.floor(G.elapsed)+'s</b></div><div class="chip"><span>'+(part?'Eliminados':'Señalados')+'</span><b>'+G.killed+'</b></div>'+(part?'<div class="chip"><span>Rivales vivos</span><b>'+surv+'</b></div>':'');
  setTimeout(()=>{show('#end',true);$('#hud').style.opacity='1';},scared?0:600);
}

const TH={};const ACC={feria:'#ffb347',pasillo:'#8fe3ee',maizal:'#b5d77c'};
function snapTo(sc,cam,w,h){
  const c=mkC(w,h),x=c.getContext('2d'),oPR=renderer.getPixelRatio();
  renderer.setPixelRatio(1);renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
  renderer.render(sc,cam);x.drawImage(canvas,0,0);
  renderer.setPixelRatio(oPR);resize();renderer.render(scene,camera);
  return c.toDataURL('image/jpeg',.9);
}
function portraitBack(){return cTex(64,128,(x,w,h)=>{const g=x.createRadialGradient(w*.5,h*.45,2,w*.5,h*.5,h*.62);g.addColorStop(0,'#2a3b45');g.addColorStop(.6,'#0f1a21');g.addColorStop(1,'#04070a');x.fillStyle=g;x.fillRect(0,0,w,h);});}
function thumbPortrait(i,rot){
  const c=CH[i],ts=new THREE.Scene(),tc=new THREE.PerspectiveCamera(28,.8,.1,30);
  ts.add(new THREE.HemisphereLight(0x6f8fa8,0x1a1410,.7));
  const key=new THREE.DirectionalLight(0xffd9b4,1.9);key.position.set(-2,2.6,3);ts.add(key);
  const rim=new THREE.DirectionalLight(0x7fb4ff,1.5);rim.position.set(2.5,2,-2.5);ts.add(rim);
  const bg=new THREE.Mesh(new THREE.PlaneGeometry(6,6),new THREE.MeshBasicMaterial({map:portraitBack(),fog:false}));bg.position.set(0,1.4,-1.6);ts.add(bg);
  const h=makeHuman(c);h.rotation.y=rot==null?-.28:rot;ts.add(h);
  for(let k=0;k<3;k++)animHuman(h,.016,1.3+k*.016,0,0);
  tc.position.set(.1,1.6,1.7);tc.lookAt(0,1.5,0);
  const u=snapTo(ts,tc,320,400);if(rot==null)TH['ch'+i]=u;return u;
}
function thumbScene(i){
  const oR=S.role,oS=S.scen;S.role='part';S.scen=i;buildWorld(SC[i]);world.userData.sc=i;
  W.look=1;W.lkB=W.lkH=1;W.pointT=0;W.point=false;for(let k=0;k<14;k++)updateWatcherVisual(.05,true);
  anim.forEach(f=>f(3.4,.016));updateSun();
  const tc=new THREE.PerspectiveCamera(50,1.6,.1,170);tc.position.set(0,2.5,19);tc.lookAt(0,3.3,0);
  TH['sc'+i]=snapTo(scene,tc,480,300);
  const hd=W.mesh.userData.head;hd.updateWorldMatrix(true,false);hd.getWorldPosition(tmpV);
  tc.fov=34;tc.position.set(tmpV.x+.9,tmpV.y+.1,tmpV.z+5.2);tc.lookAt(tmpV.x,tmpV.y-.1,tmpV.z);
  TH['w'+i]=snapTo(scene,tc,320,320);
  S.role=oR;S.scen=oS;
}
function applyThumbs(){
  document.querySelectorAll('.ph[data-k]').forEach(el=>{
    let k=el.dataset.k;if(k==='rp')k='ch'+S.char;else if(k==='rw')k='w'+S.scen;
    const u=TH[k];if(!u||el.dataset.u===u)return;el.dataset.u=u;el.innerHTML='<img class="pic" alt="" decoding="async" src="'+u+'">';
  });
}
function makeThumbs(){
  const jobs=[];for(let i=0;i<CH.length;i++)jobs.push(()=>thumbPortrait(i));for(let i=0;i<SC.length;i++)jobs.push(()=>thumbScene(i));
  jobs.push(()=>{buildWorld(SC[S.scen]);world.userData.sc=S.scen;});
  let n=0;const step=()=>{
    if(G.state!=='menu'){if(n>0&&world&&world.userData.sc!==S.scen){/* el usuario ya jugó: no tocar */}return;}
    try{jobs[n]();}catch(e){console.warn('thumb',e);}
    n++;applyThumbs();if(n<jobs.length)setTimeout(step,40);
  };
  setTimeout(step,250);
}

function buildMenu(){
  const ch=$('#chars');ch.innerHTML='';

    b.innerHTML='<span class="ph" data-k="ch'+i+'">'+svgPerson(c)+'</span><h3>'+c.name+'</h3><p>'+c.desc+'</p><div class="meter"><span>Veloz</span><b><i style="width:'+((c.speed-.8)/.4*100).toFixed(0)+'%"></i></b></div><div class="meter"><span>Quietud</span><b><i style="width:'+((c.calm+.06)/.22*100).toFixed(0)+'%"></i></b></div>';
